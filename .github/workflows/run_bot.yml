name: Send Morning Message

on:
  schedule:
    # Đổi giờ chạy thành 8:00 sáng giờ Việt Nam mỗi ngày (tương ứng 1:00 UTC)
    - cron: '0 1 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Run bot
        run: python bot.py
